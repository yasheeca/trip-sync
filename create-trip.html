<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create a trip | TripSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="nav nav-light">
      <a class="brand" href="index.html"
        ><span class="brand-mark">✦</span><span>Trip<span>Sync</span></span></a
      ><a class="text-link" href="dashboard.html">← Back to trips</a>
    </nav>
    <main class="form-page">
      <div class="form-intro">
        <p class="kicker">A NEW ADVENTURE</p>
        <h1>Where will you<br /><em>go together?</em></h1>
        <p>
          Start with the essentials. You can shape every detail once your trip
          is underway.
        </p>
      </div>
      <form id="createTripForm" class="form-card">
        <label
          >Trip name<input
            name="name"
            required
            placeholder="e.g. Slow summer in Portugal"
        /></label>
        <div class="form-row">
          <label
            >Destination<input
              name="destination"
              required
              placeholder="City or country" /></label
          ><label
            >Budget <span class="muted">(₹)</span
            ><input
              name="budget"
              type="number"
              min="0"
              required
              placeholder="50000"
          /></label>
        </div>
        <div class="form-row">
          <label
            >Start date<input name="startDate" type="date" required /></label
          ><label>End date<input name="endDate" type="date" required /></label>
        </div>
        <label
          >Short description<textarea
            name="description"
            rows="3"
            placeholder="What are you hoping to discover?"
          ></textarea></label
        ><label
          >Cover image URL <span class="muted">(optional)</span
          ><input
            name="coverImage"
            type="url"
            placeholder="https://images.unsplash.com/..."
        /></label>
        <div class="image-options">
          <button
            type="button"
            class="image-choice selected"
            data-image="https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=1000&q=85"
            style="
              background-image: url(&quot;https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=300&q=70&quot;);
            "
          >
            Coast</button
          ><button
            type="button"
            class="image-choice"
            data-image="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1000&q=85"
            style="
              background-image: url(&quot;https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=300&q=70&quot;);
            "
          >
            Road trip</button
          ><button
            type="button"
            class="image-choice"
            data-image="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=1000&q=85"
            style="
              background-image: url(&quot;https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=300&q=70&quot;);
            "
          >
            Mountains
          </button>
        </div>
        <input
          type="hidden"
          name="selectedImage"
          value="https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=1000&q=85"
        /><button class="button button-accent button-submit" type="submit">
          Create trip <span>→</span>
        </button>
      </form>
    </main>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
    <script src="trips.js"></script>
  </body>
</html>
